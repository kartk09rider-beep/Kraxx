name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: src
        run: chmod +x ./gradlew

      - name: Make Release & Plugins JSON
        working-directory: src
        run: ./gradlew make makePluginsJson --stacktrace

      - name: Collect output
        run: |
          mkdir -p build/release
          cp src/*/build/*.cs3 build/release/
          cp src/build/plugins.json build/release/
          ls -la build/release

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build/release
